name: AcoreZero — автопродление

on:
  schedule:
    - cron: '0 */10 * * *'   # каждые 10 часов (запас к лимиту 16ч)
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renew (если секреты добавлены)
        env:
          ACORE_RENEW_URL: ${{ secrets.ACORE_RENEW_URL }}
          ACORE_TOKEN: ${{ secrets.ACORE_TOKEN }}
        run: |
          if [ -z "$ACORE_RENEW_URL" ] || [ -z "$ACORE_TOKEN" ]; then
            echo "::warning:: Секреты ACORE_RENEW_URL / ACORE_TOKEN не заданы — пропуск."
            echo "Как только выясним их API: repo Settings → Secrets and variables → Actions → добавь оба."
            exit 0
          fi
          echo "Отправляю продление..."
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACORE_TOKEN" \
            -H "Accept: application/json" \
            "$ACORE_RENEW_URL")
          echo "HTTP $code"
          case "$code" in
            200|201|204) echo "Продление ОК";;
            *) echo "::error:: Продление не прошло (HTTP $code) — задача падает, чтобы заметить."; exit 1;;
          esac
