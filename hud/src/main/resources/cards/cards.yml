# ═══════════════════════════════════════════════════════════════════════════
#  КАРТОЧКИ ПРЕДМЕТОВ — единое описание ДЛЯ ЛЮБОГО предмета игры (и будущих кастомных)
#  Папка plugins/PoliticHellHUD/cards/:
#    cards.yml   — этот файл: общий вид, редкости, привязки, правила
#    items.yml   — СВОИ предметы (создать, выдать: /card give <ник> <id>)
#    vanilla.yml — правки обычных предметов Minecraft (создаётся командой /card export — там уже всё заполнено)
#  После правок: /card reload   (предметы в инвентарях обновятся сами за секунду)
#
#  Как выглядит предмет:
#    [иконка] Название            ← градиент цвета редкости
#    Персональный · Эпический     ← привязка (что с предметом можно делать) и редкость
#    ────────── ◆ ──────────      ← перегородка (рисунок из пака, цвет — от редкости)
#    Описание серым…              ← кратко; полностью — по Shift+ПКМ
#    ────────── ◆ ──────────
#    Характеристики…              ← только в подробном виде
#  Фон и рамку подсказки рисует ресурспак (свой стиль на каждую редкость).
# ═══════════════════════════════════════════════════════════════════════════

enabled: true            # false — выключить систему целиком (предметы остаются как есть; /card strip снимет оформление)

# Как часто (в тиках, 20 = 1 с) плагин досматривает инвентари игроков и оформляет новые предметы.
# Меньше — быстрее подхватывает, чуть больше нагрузка. 10 — хороший вариант.
scan-ticks: 10

# Оформлять предметы, у которых УЖЕ есть чужое описание (от других плагинов: магазины, квесты)? Обычно нет.
decorate-foreign: false

detail:
  default: compact       # compact — кратко (по умолчанию) | full — сразу подробно
  # Как игрок переключает «кратко/подробно» (для себя, на все предметы сразу):
  #   shift-right — Shift + правая кнопка мыши по предмету в инвентаре; none — только командой /tip
  # (В ванильном Minecraft сервер не видит, что игрок просто навёл мышь и держит Shift — поэтому именно клик.)
  toggle-click: shift-right
  compact-lines: 2       # сколько строк описания в кратком виде

layout:
  # Вид карточки по умолчанию (каждый игрок выбирает свой: /tip style  или  /phh):
  #   classic — «Классика»: одна колонка, перегородки (ширина — width ниже)
  #   wide    — «Широкая»: две колонки на плашках — слева описание, справа характеристики и зачарования
  #   tech    — «Терминал»: один столбец блоков-плашек с яркой полосой слева, по плашке на раздел
  style: classic
  # Цвета плашек (для wide и tech): это ОТТЕНОК — сама плашка в паке серая и затемняет его. Пока не нужно — не трогай.
  plates:
    desc: "#4A78E0"       # описание — синяя
    stats: "#36B4C8"      # характеристики — бирюзовая
    ench: "#9A66F0"       # зачарования и книги — фиолетовая
    effects: "#48C078"    # эффекты еды и зелий — зелёная
    info: "#8A90AE"       # привязка, срок, владелец — серо-синяя
  # Размеры плашек (112 + 4 + 112 = 228 px широкая, 156 px — терминал) заданы в паке (tools/cards_art.py, PLATES) и в коде.
  width: 126             # ширина карточки в пикселях (= ширине перегородки в паке). Описание переносится по ней
  divider: glyph         # glyph — нарисованная перегородка из пака | text — обычные символы «────» (если пак не нужен)
  desc-color: "#B4C6EA"  # цвет описания (голубоватый)
  stat-label: "#9DB4D8"  # подпись характеристики
  stat-value: "#FFFFFF"  # значение
  stat-plus: "#6BE07A"   # значения с «+»
  stat-minus: "#FF6B6B"  # значения с «−»
  hint-color: "#6F7FA0"  # подсказка внизу
  tooltip-style-prefix: "politichell:card_"   # стиль рамки: <префикс><редкость>, спрайты в паке (source_art/cards/)
  hide-vanilla-attributes: true   # прятать ванильные строки «В основной руке: …» — их заменяют наши характеристики
  show-owner: true       # в подробном виде писать «Владелец: …» у персональных предметов

# ── РЕДКОСТИ ──  stops — цвета градиента названия (от начала к концу; можно 2–5 цветов, формат #RRGGBB)
rarities:
  common:    { name: "Обычный",     stops: ["#F4F4F8", "#A9AAB4"] }
  uncommon:  { name: "Необычный",   stops: ["#C4FFA8", "#38D066"] }
  rare:      { name: "Редкий",      stops: ["#A8E0FF", "#3C7BFF"] }
  epic:      { name: "Эпический",   stops: ["#F0C0FF", "#B35CFF", "#7A32E6"] }
  legendary: { name: "Легендарный", stops: ["#FFF0A0", "#FFB02E", "#FF7A18"] }
  mythic:    { name: "Мифический",  stops: ["#FFB4A0", "#F0384A", "#A0102E"] }

# ── ПРИВЯЗКИ ──  вторая строка карточки: что можно делать с предметом
#  consumable — Свободный: обычный предмет. Можно выбросить, положить в сундук, передать; после смерти выпадает.
#  personal   — Персональный: НЕ выпадает и не теряется после смерти; нельзя выбросить, положить в сундук/печь/верстак,
#               передать. Хранить можно только в эндер-сундуке и шалкере (шалкер с таким предметом тоже становится
#               «персональным»: выбросить/потерять его нельзя, а если он как-то выпадет — предмет всё равно вернётся к владельцу).
#  locked     — Неотчуждаемый: ещё жёстче. Только в инвентаре игрока: нельзя ни в эндер-сундук, ни в шалкер, ни куда-либо.
#  temporary  — Временный: исчезает по таймеру (ttl) или по событию (event). Обычно сочетают с самим сроком — см. items.yml.
bindings:
  consumable: { name: "Свободный",     color: "#9EA3B0", text: "Обычный предмет: можно передавать и продавать, но после смерти он выпадает." }
  personal:   { name: "Персональный",  color: "#5CC8FF", text: "Принадлежит только тебе: не выпадает после смерти, его нельзя выбросить, потерять или положить в сундук — только в эндер-сундук или шалкер." }
  locked:     { name: "Неотчуждаемый", color: "#FF9A3C", text: "Намертво привязан к тебе: остаётся только в твоём инвентаре. Ни выбросить, ни убрать в любое хранилище, ни передать." }
  temporary:  { name: "Временный",     color: "#7FE3CB", text: "Исчезнет сам, когда выйдет срок или закончится событие." }

# ── ПРАВИЛА ПРИВЯЗКИ ──
rules:
  # В каких «окнах» можно держать Персональный предмет (кроме инвентаря игрока). Неотчуждаемый — нигде.
  # Типы: ENDER_CHEST, SHULKER_BOX, ANVIL, ENCHANTING, GRINDSTONE, SMITHING … (список InventoryType из Bukkit).
  # Осторожно: в наковальне/кузнице предмет можно потратить как ингредиент — по умолчанию их нет.
  personal-allowed: [ENDER_CHEST, SHULKER_BOX]
  # Привязанный предмет не ломается: когда прочность на исходе — урон просто не засчитывается
  unbreakable-bound: true
  # Подсказка игроку (над хотбаром), когда действие запрещено
  deny-message: "&cЭтот предмет привязан к тебе — так нельзя"

  # ── ОБХОД ПРАВИЛ (для админов) ──
  # Права op САМИ ПО СЕБЕ обход НЕ дают — иначе админ при проверке не увидит, как привязка работает у игроков.
  # Админ включает обход осознанно: /card bypass on  (выключается /card bypass off и при выходе с сервера).
  # Для команды нужно право politichellhud.admin (у op есть).
  bypass-creative: false      # true — в творческом режиме привязка не действует (по умолчанию действует)

  # ── ДОПОЛНИТЕЛЬНЫЕ ЗАЩИТЫ (чтобы привязанный предмет нельзя было «слить» обходным путём) ──
  block-entity-give: true     # нельзя отдать из руки мобам: Тихоне, пиглину, лошади/ослу/верблюду/ламе, волку, свинье, лавоходу и т. п.
  block-block-insert: true    # нельзя вложить из руки в блок: декоративный горшок, полки, аналой, костёр, проигрыватель, горшок для цветов, компостер
  trident-owner-only: true    # брошенный привязанный трезубец поднимет только владелец

  # ── ПРИВЯЗКА «ПРИ СОБЫТИИ» (bind-on) ──
  # Задаётся в groups.yml / vanilla.yml / items.yml полем  bind-on:
  #   pickup — привяжется к тому, кто ПЕРВЫМ взял предмет (подобрал, получил из сундука, скрафтил)
  #   equip  — привяжется, когда игрок НАДЕНЕТ предмет (броня), возьмёт в левую руку или выберет в хотбаре
  #   use    — привяжется при первом ИСПОЛЬЗОВАНИИ: ударил, добыл блок, кликнул предметом
  # До события предмет «Свободный» (его можно передать), в описании написано «Привяжется при …».
  # После — становится тем, что указано в binding: (Персональный / Неотчуждаемый), и владелец — этот игрок.
