GOLD_BLOCK: { desc: "Блок золота: девять слитков; пиглины любят золото." }
HONEY_BOTTLE: { desc: "Бутылка мёда: снимает отравление; стеклянная тара остаётся." }
MELON_SLICE: { desc: "Долька арбуза: лёгкая еда; девять штук дают блок арбуза." }
MUSHROOM_STEW: { desc: "Грибной суп: сытная еда в миске." }
MUTTON: { desc: "Сырая баранина: лучше пожарить в печи." }
OCHRE_FROGLIGHT: { desc: "Охристый светолягушник: яркий светильник; остаётся, когда умеренная лягушка съест малого магмового слизня." }
PEARLESCENT_FROGLIGHT: { desc: "Перламутровый светолягушник: яркий светильник; остаётся, когда тёплая лягушка съест малого магмового слизня." }
POISONOUS_POTATO: { desc: "Ядовитый картофель: может отравить, лучше не есть." }
PORKCHOP: { desc: "Сырая свинина: лучше пожарить в печи." }
POTATO: { desc: "Картофель: сажается на грядку; в печи становится печёным." }
