CARROT: { desc: "Морковь: еда и семена в одном; кормит свиней и кроликов." }
CHICKEN: { desc: "Сырая курица: может отравить, лучше пожарить." }
CHIPPED_ANVIL: { desc: "Потрескавшаяся наковальня: уже изношена; может перейти в худшее состояние при работе." }
CHORUS_FRUIT: { desc: "Плод хоруса: еда, после которой тебя телепортирует рядом." }
