COOKED_COD: { desc: "Жареная треска: простая рыбная еда." }
COOKED_MUTTON: { desc: "Жареная баранина: сытная еда." }
COOKED_PORKCHOP: { desc: "Жареная свинина: сытная еда, жарится в печи." }
