# ════════════════════════════════════════════════════════════════════════════
#  economy.yml — ДЕНЬГИ (монеты + донат)
#
#  КАК ЭТО РАБОТАЕТ
#   • МОНЕТЫ (жёлтая плашка) — через Vault. Vault сам денег не хранит: он «переходник» между плагинами.
#     Нужен ОДИН плагин-экономика, который зарегистрирован в Vault.
#       У тебя это «Vault 2.0 economy» (jar называется Vault, v2.x) — он и API, и экономика сразу.
#       Если поставишь оригинальный Vault.jar (MilkBowl) — к нему обязательно нужен отдельный плагин
#       экономики (EssentialsX Economy, XConomy, CoinsEngine…), иначе денег не будет.
#     Все плагины (магазины, Towny, налоги, аукционы) работают с ТЕМИ ЖЕ деньгами, что и HUD.
#   • ДОНАТ (фиолетовая плашка) — отдельная валюта. Vault умеет только одну основную валюту, поэтому донат:
#       file         — хранится в plugins/PoliticHellHUD/data.yml (по умолчанию, работает сразу)
#       playerpoints — через плагин PlayerPoints (если нужен донат, который видят другие плагины/магазины)
#
#  КОМАНДЫ
#   игрок:  /balance (Vault)   /pay (Vault)   /hudbalance — обе валюты текстом
#   админ:  /eco give|take|set <ник> <сумма> — монеты (Vault)
#           /hudeco give|take|set|get <ник> coins|donate <сумма> — любая из двух валют;  /hudeco info — что подключено
#  Применить правки: /hudreload
# ════════════════════════════════════════════════════════════════════════════

# Откуда брать монеты:
#   auto  — Vault, если есть плагин-экономика; нет — временно data.yml (в логе будет предупреждение)  ← рекомендую
#   vault — как auto (смысл тот же; оставлено, чтобы явно показать «только Vault»)
#   file  — Vault игнорировать, монеты всегда в data.yml (для тестов без Vault)
mode: auto

# Как часто (в тиках, 20 = 1 сек) обновлять баланс для плашки/таба/скорборда. 10 = 2 раза в секунду.
# Меньше — быстрее реакция на покупку, но больше нагрузка на плагин-экономику. Советую 10.
refresh-ticks: 10

# Если в Vault зарегистрировано НЕСКОЛЬКО плагинов-экономик (например «Vault 2.0 economy» и EssentialsX), игра выберет
# одну по приоритету — не всегда ту, что ты хочешь, а в /hudeco info и в логе будет пометка [!].
# Впиши имя плагина, чтобы выбрать явно: Vault  или  Essentials.   Пусто = как решит Vault.
# СОВЕТ: оставь ОДНУ экономику. Если нужен только Vault 2.0 — в EssentialsX отключи экономику: plugins/Essentials/config.yml →
#   disabled-commands: [balance, pay, eco, baltop]   (и не давай игрокам права essentials.balance/pay).
vault-provider: ""

donate:
  # auto         — PlayerPoints, если он установлен (рекомендую), иначе файл data.yml
  # playerpoints — только PlayerPoints (донат-очки видят магазины/меню; выдаёт /points give <ник> <число>)
  # file         — файл data.yml плагина
  source: auto

# Стартовый баланс НОВОГО игрока — ТОЛЬКО когда монеты/донат хранит этот плагин (mode: file или Vault не найден,
# donate.source: file). Стартовые монеты Vault-экономики задаются в конфиге САМОГО плагина-экономики
# (у Vault 2.0 — plugins/Vault/config.yml).
start-balance:
  coins: 500
  donate: 0
