# ════════════════════════════════════════════════════════════════════════════
#  hud.yml — деньги над сердцами (две плашки: монеты и донат)
#  Пак один и встроен в плагин, в нём ТРИ высоты плашек. Выбери и примени /hudreload (пак пересылать не надо):
#     height: tight  — почти вплотную к сердцам/еде (по умолчанию)
#     height: armor  — выше, над рядом брони
#     height: high   — ещё выше (над пузырьками воздуха и сердцами верховой лошади)
#  Размер плашек (style: mini) зашит в пак — не меняй.
# ════════════════════════════════════════════════════════════════════════════

height: tight     # tight | armor | high — см. выше
style: mini        # в паке только мини-плашки — не менять

# Порядок слева направо.  [donate, coins] или [coins, donate]
order: [donate, coins]

# Как часто перерисовывать, когда число не меняется (тики; actionbar «живёт» ~60 тиков). 10 = нормально.
idle-refresh-ticks: 10

# Анимация «накрутки» числа при изменении баланса
animation:
  enabled: true
  speed: 0.22        # доля разницы за шаг: 0.1 = медленно, 0.5 = быстро
  hold-ticks: 24     # сколько тиков число остаётся зелёным/красным после изменения (20 тиков = 1 сек)

# Насыщение: золотая обводка поверх иконок еды — сколько насыщения осталось (как мод AppleSkin, но без мода). Целая обводка = 2 очка, половина = 1.
# Пока насыщение есть, голод не падает; кончилось — иконки еды начинают убывать. Не рисуется в творческом режиме и верхом.
saturation:
  enabled: true

# Цвета цифр
colors:
  normal: "#FFFFFF"
  gain: "#55FF55"    # число выросло
  loss: "#FF5555"    # число упало
  # Буквы сокращений:  K = тысячи, M = миллионы, B = миллиарды, T = триллионы.
  # Примеры: 100000, 1M, 1M10K, 3M142K, 2B500M. Цифры остаются белыми, буквы — цветные.
  suffix-enabled: true
  suffix-k: "#BFBFBF"
  suffix-m: "#FFC83C"
  suffix-b: "#FF7AFF"
  suffix-t: "#55FFFF"

# ── Скорборд (боковая панель, рисует TAB; сам плагин даёт переключатель стилей) ──
scoreboard:
  # Какой стиль видит игрок, пока сам не выбрал:  compact — компактный (иконки, 9 строк)
  #                                              full    — полный (подписи «Страна:», «Город:»…, 13 строк, шире)
  # Игрок меняет сам:  /sbstyle full | compact | toggle   (короткая форма /sbs). Выбор запоминается.
  # В TAB оба скорборда уже прописаны с условием %phhud_sb%=full / compact.
  default: compact

# ── Шапка TAB (над списком игроков): три стиля ──
tab:
  # Какой стиль видит игрок, пока сам не выбрал:  panel   — рамка-свечение, как у скорборда (лайм)
  #                                              pillars — цельные колонны по бокам + переливающийся фон
  #                                              min     — без рамки, только титул и погода/время
  # Игрок меняет сам:  /tabstyle panel | pillars | min   (без слова — следующий; короткая форма /tabs). Выбор запоминается.
  # В TAB (tab/config.yml) три design с условием %phhud_tabstyle%=… — после /hudupdate таб они уже на месте.
  default-style: pillars

# ──────────────────────────────────────────────────────────────────────────
#  ГЕОМЕТРИЯ (трогай только если сам меняешь картинки плашек; значения см. tools/build_pack.py)
# ──────────────────────────────────────────────────────────────────────────
# mini:
layout-mini:
  plate-advance: 35    # ширина плашки + 1 px
  gap: 1               # просвет между плашками
  shift-right: 101     # сдвиг вправо от центра экрана (центр полосы еды ≈ +50 px, значит 2×50).
                       # Плашки левее/правее нужного → меняй на ±2..10. 0 = по центру экрана.
  donate:
    text-center: 20    # где центр серой области под цифры (px от левого края плашки)
    text-max-width: 25 # сколько px влезает; длиннее — число сокращается (3M142K → 3.1M)
  coins:
    text-center: 14
    text-max-width: 25
# normal:
layout:
  plate-advance: 68
  gap: 2
  donate:
    text-center: 40
    text-max-width: 49
  coins:
    text-center: 27
    text-max-width: 49
