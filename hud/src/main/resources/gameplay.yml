# ════════════════════════════════════════════════════════════════════════════
#  gameplay.yml — правила и «живая» логика: AFK, новичок, тестовые НПС
# ════════════════════════════════════════════════════════════════════════════

# ── AFK ───────────────────────────────────────────────────────────────────
# Через сколько секунд без действий игрок считается AFK (значок Zzz в табе и над головой, ник серый).
# Выходит из AFK сам, как только что-то сделает: повернул мышь, нажал WASD/пробел/Shift, кликнул, сменил слот, написал в чат.
# Сдвиг водой/поршнем/отбрасыванием «жизнью» не считается. Если установлен EssentialsX — его /afk тоже показывает значок.
afk:
  seconds: 120
  messages: true         # короткая подсказка в actionbar при входе в AFK и выходе из него
  never-kick: true     # AFK НЕ выгоняет с сервера: если Essentials (auto-afk-kick) или сервер (player-idle-timeout) пытаются кикнуть за бездействие —
                       # кик отменяется, игрок просто остаётся AFK. Лучше ещё и выключить в самих настройках: Essentials config.yml → auto-afk-kick: -1

# ── Новичок ───────────────────────────────────────────────────────────────
# Пока игрок наиграл меньше N часов: у всех над ником ГОЛУБАЯ точка, работают %phhud_newbie% и %phhud_newbie_left%.
# Совет: на живом сервере 3–10 часов. Для теста поставь 1000 — все станут новичками.
newbie:
  hours: 3
  protect-pvp: false     # true = новичка нельзя бить, и он сам не бьёт игроков (голос и чат не ограничиваются)

# ── Страна игрока ──────────────────────────────────────────────────────────
# Страна = нация Towny (/n new <название>), а пока нации нет — город (/t new <название>). Это название видно в табе, скорборде и над ником.
# Флаг — только тот, который игрок сам выбрал: /country flag <id> (список /country list). Не выбрал — флага нигде нет.
# Ничего автоматически не ставится ни игрокам, ни по списку.
country:
  source: auto          # auto = название нации Towny, а если нации нет — название ГОРОДА (рекомендуется: в начале у всех только города)
                        # nation = только нация · town = всегда город · manual = БЕЗ Towny: игрок сам /country name <текст>
  name-max-length: 24   # только для source: manual

# ── Ник над головой ───────────────────────────────────────────────────────
nametag:
  name-color: "&7"      # цвет ника (серый). Отношение к игроку показывает ТОЛЬКО цветная точка, слов нет

# ── Тестовые НПС (/hudnpc demo) — превью дизайна ников ───────────────────
npc:
  y-offset: 2.05         # высота надписи над ногами НПС (блоки). Выше/ниже → меняй ±0.1

# ── Связки с другими плагинами (всё через PlaceholderAPI, ставить ничего дополнительно не надо) ─────────────
integrations:
  plasmovoice: auto     # auto — значок голоса сам включается, если у игрока установлен мод Plasmo Voice. off — только ручной /hudvoice
  towny: auto           # auto — город/роль в скорборде берутся из Towny. off — оставить «—»
