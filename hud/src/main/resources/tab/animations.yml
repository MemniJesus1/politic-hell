# ════════════════════════════════════════════════════════════════════════════
#  animations.yml для TAB — анимированная рамка шапки PoliticHell: по цельной колонне слева и справа на всю высоту шапки
#  и лёгкий переливающийся фон, тающий сверху вниз. Ставится командой /hudupdate таб вместе с config.yml. Подключена в header (config.yml): %animation:PhBanner%
#
#  Как устроено: рамка — 4 картинки-символа в ресурспаке (колонна слева, два куска фона по центру, колонна справа), склеены
#  вплотную (\uF201 = сдвиг назад на 1 px). Восемь кадров — блик по неоновой кромке, полоса света по корпусу и переливы фона.
#  Скорость: change-interval (мс). 150 мс = цикл 1,2 сек. Чем меньше — тем плавнее, но тем чаще TAB шлёт шапку игрокам.
#  Статичная рамка (без анимации): оставь в texts один любой кадр.
#  Рамка шириной 224 px и высотой 45 px = 5 строк шапки: внутри (между колоннами, ~190 px) лежат строки титула и погоды.
# ════════════════════════════════════════════════════════════════════════════
animations:
  PhBanner:
    change-interval: 150
    texts:
      - "&f\uE800\uF201\uE810\uF201\uE820\uF201\uE830\uF201"
      - "&f\uE801\uF201\uE811\uF201\uE821\uF201\uE831\uF201"
      - "&f\uE802\uF201\uE812\uF201\uE822\uF201\uE832\uF201"
      - "&f\uE803\uF201\uE813\uF201\uE823\uF201\uE833\uF201"
      - "&f\uE804\uF201\uE814\uF201\uE824\uF201\uE834\uF201"
      - "&f\uE805\uF201\uE815\uF201\uE825\uF201\uE835\uF201"
      - "&f\uE806\uF201\uE816\uF201\uE826\uF201\uE836\uF201"
      - "&f\uE807\uF201\uE817\uF201\uE827\uF201\uE837\uF201"
