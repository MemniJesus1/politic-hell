# ═════════════════════════════════════════════════════════════════════════════
#  plugins/TAB/groups.yml — PoliticHell (v1.8)
#  Под каждым ником — плашка-фон (твоя картинка plate_name.png): %phhud_tabbg% / %phhud_tagbg% (ставятся В НАЧАЛО префикса).
#  ТАБ (список игроков):  [ранг] [флаг] Ник [Zzz][голос]     — флаг-заглушка той же ширины, если флага нет (ники ровные)
#  НИК НАД ГОЛОВОЙ:       [●отношение][ранг] Ник [Zzz][голос] [флаг] Страна    (флаг и страна — только если игрок их задал)
#  • ● = цветная точка: зелёная — своя страна, голубая — союзник/союз наций/новичок, красная — враг, серая — нейтрал. Слов нет.
#  • [ранг] = значок привилегии из ranks.yml плагина (по умолчанию «Игрок»), сам меняется по группе LuckPerms.
#  • %rel_phhud_relation% — у каждого зрителя своё значение (для себя пусто)
#  • %phhud_name_color% стоит ПОСЛЕДНИМ в prefix — по нему TAB красит ник
#  • перед каждой иконкой &f, иначе клиент её затонирует
# ═════════════════════════════════════════════════════════════════════════════
_DEFAULT_:
  tabprefix: "&f%phhud_tabbg%&f%phhud_rank% %phhud_flag_pad% %phhud_name_color%"
  customtabname: "%player%"
  tabsuffix: " &f%phhud_afk%%phhud_voice%"
  tagprefix: "&f%phhud_tagbg%&f%rel_phhud_relation%%phhud_rank% %phhud_name_color%"
  tagsuffix: " &f%phhud_afk%%phhud_voice%%phhud_nation_tag_10%"
