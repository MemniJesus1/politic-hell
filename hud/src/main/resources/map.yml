# ════════════════════════════════════════════════════════════════════════════
#  map.yml — полноэкранная карта (клавиша F)
#  Работает поверх плагина NMinimap-PH (форк NMinimap, лежит в архиве PoliticHell рядом с PoliticHellHUD.jar).
#  Без него этот файл ни на что не влияет, остальной HUD работает как обычно.
#  После правок: /hudreload  (или /map reload)
#
#  УПРАВЛЕНИЕ (клиент ванильный — «любую клавишу» сервер не видит, поэтому используются эти):
#    F ................ открыть / закрыть            Пробел ........ вернуться к себе
#    W A S D .......... двигать карту (Ctrl — быстрее)   Колесо ....... масштаб 1:1, 1:2, 1:4, 1:8
#    Shift + колесо ... выбрать значок точки         ЛКМ ........... поставить точку под прицелом (центр экрана)
#    Shift + ЛКМ ...... удалить ближайшую свою точку   ПКМ ........... МЕНЮ КАРТЫ (кнопки мышью: сдвиг, масштаб, точки, мини-карта)
#    Q ................ перейти к следующей точке    Shift + Q ..... переименовать точку под прицелом
#  Игрок на время просмотра «заморожен» (не ходит, не бьёт, не ломает), карта закрывается при уроне.
#
#  Что видно на карте: спавн, твоя кровать, место смерти, личные точки (/waypoint), общие точки (/hudpoi),
#  города/войны (если подключены), ты сам (со стрелкой направления), радар мобов (по желанию, /map radar).
#  КАРТА СТРОИТСЯ ПО ИЗВЕДАННОМУ: видны только чанки, которые кто-то уже загружал (остальное — тёмное «туман войны»).
#  Хочешь открыть всю карту сразу — предзагрузи мир Chunky'ем (render-new-chunks в NMinimap/config.yml уже включён).
# ════════════════════════════════════════════════════════════════════════════

enabled: true            # false — выключить полноэкранную карту совсем
open-with-f: true        # F открывает карту. Если false — только команда /map. (Обмен предметов между руками на F тогда работает как в ваниле)
default-scale: 4         # масштаб при открытии: 1 (подробно, ~127 блоков в ширину), 2, 4 (~500 блоков), 8 (~1000 блоков)
default-icon: wp         # какой значок выбран по умолчанию: wp star home spawn death town war crown

pan-speed: 30            # скорость движения карты клавишами, «пикселей карты» в секунду (Ctrl ускоряет)
pan-sprint-multiplier: 3 # во сколько раз быстрее с Ctrl
select-radius-px: 7      # «захват» точки прицелом (в пикселях карты): так близко к центру точка считается «под прицелом»
click-delay-ticks: 5     # пауза между кликами по карте (защита от случайного двойного клика)
max-point-distance: 0    # 0 = точку можно ставить где угодно; иначе — не дальше N блоков от тебя
                         # (лимит личных точек — max-waypoints в compass.yml)

freeze-player: true      # пока карта открыта, игрок стоит на месте (скорость и прыжок = 0). false — можно ходить, но управление WASD тогда двигает и тебя
close-on-damage: true    # закрывать карту, если игрока ударили

help:
  show: true             # показывать подсказку по клавишам в чате при открытии
  times: 3               # сколько первых открытий (у каждого игрока), потом подсказка не показывается (всегда есть /map help)

# ── Слот «игроков рядом» под мини-картой (рамки nova / amethyst / frost / crimson, квадратная карта) ──
# В слоте слева под картой: значок «люди» и число игроков вокруг тебя: «-» — никого, 1…99. Цвет цифр: 1–3 белые, 4–9 янтарные, 10+ красные.
# Считаются игроки того же мира в радиусе radius блоков (не считаются наблюдатели и скрытые от тебя / vanish). Обновляется раз в секунду.
nearby:
  enabled: true
  radius: 64                # блоков (по прямой, с учётом высоты)
  frames: [nova, amethyst, frost, crimson]   # у каких рамок есть слот (другие рамки слот не рисуют)
