# ════════════════════════════════════════════════════════════════════════════
#  PoliticHellHUD — ОСНОВНОЙ конфиг.   Остальное в соседних файлах:
#     hud.yml       — деньги над сердцами (вид, цвета, анимация)
#     compass.yml   — компас и точки на боссбаре
#     economy.yml   — деньги: Vault, донат, стартовый баланс
#     gameplay.yml  — AFK, новичок, тестовые НПС
#     countries.yml — список стран/флагов (создаёт build_pack.py, руками не правь)
#  После правки любого файла:  /hudreload
# ════════════════════════════════════════════════════════════════════════════

# ── Экономика — теперь в economy.yml (монеты через Vault, донат — PlayerPoints или файл).

# ── РЕСУРСПАК: один, всегда актуальный ───────────────────────────────────────
# Пак лежит ВНУТРИ плагина и раздаётся игрокам сам (встроенный веб-сервер). Обновил плагин — обновился пак.
# Руками ничего скачивать и класть в resourcepacks НЕ НУЖНО (старые копии пака из папки клиента удали).
#   • server.properties:  resource-pack=   (оставь ПУСТО, иначе будет два пака)
#   • в записи сервера у клиента: «Наборы ресурсов сервера» = Включено (один раз, потом запомнит)
#   • новый пак после обновления плагина:  /hudupdate   (или просто /hudpack)
pack:
  enabled: true
  source: embedded    # embedded = пак из jar (рекомендуется) | file = свой zip с диска (ниже) | url = внешняя ссылка (ниже)
  address: auto       # auto = тот адрес, по которому игрок зашёл на сервер. Можно задать вручную: "play.example.com"
  port: 8765          # порт раздачи пака. Играешь один/локально — ничего не делай. Для друзей из интернета: пробрось TCP 8765 на роутере
                      #   (так же, как порт 25565) и открой его в брандмауэре Windows
  merge-nminimap: true # true = если установлен NMinimap-PH, его пак карты (plugins/NMinimap/built-pack.zip) добавляется в наш пак автоматически: игроку приходит один пак
  required: false     # true = без пака нельзя играть (кикает отказавшихся). Для первых тестов лучше false
  prompt: "<gold>PoliticHell</gold> <gray>— ресурспак интерфейса"
  file: ""            # для source: file, например D:/Programms/мой_пак.zip
  url: ""             # для source: url, например https://example.com/PoliticHellHUD.zip

# ── ОБНОВЛЕНИЕ ───────────────────────────────────────────────────────────────
# /hudupdate [всё|пак|таб|конфиги] — см. Проверка_и_команды.md
update:
  auto-apply: true    # при первом запуске НОВОЙ версии плагина сам обновить конфиги TAB (старые — в plugins/PoliticHellHUD/backup/)
