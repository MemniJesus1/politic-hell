# ════════════════════════════════════════════════════════════════════════════
#  compass.yml — компас и детекторы на боссбаре
#  Линейка сверху экрана: курс цифрами, метки, значки точек; под ней — координаты.
#  Нужен ресурспак (боссбар белого цвета в нём прозрачный).  TAB-боссбар должен быть ВЫКЛЮЧЕН.
#  Команды игроков:  /compass on|off   /waypoint add|del|list|clear   Админ:  /hudpoi add|del|list
# ════════════════════════════════════════════════════════════════════════════

enabled: true

# Режим отображения:
#   font — красивая линейка с иконками и плавным растворением (НУЖЕН ресурспак PoliticHellHUD v1.8+ — без него вместо меток квадратики)
#   text — простая лента из букв и точек «· · NW · · N · · NE ·» БЕЗ ресурспака (яркость падает к краям). Запасной вариант:
#          если у тебя вместо компаса квадратики — поставь text, /hudreload, и компас точно заработает.
mode: font

# ── Вид линейки ─────────────────────────────────────────────────────────────
width: 180               # ширина в GUI-пикселях. Зашита в пак — без надобности не меняй
pixels-per-degree: 1.5   # «масштаб»: 1.0 = виден сектор ±90°,  1.5 = ±60° (по умолчанию),  2.0 = ±45°,  3.0 = ±30°
fade:                    # плавное растворение к краям (метки и значки становятся прозрачнее)
  start: 0.20            # с какого места от центра начинается (0 = сразу от центра, 0.5 = только последняя половина)
  curve: 1.6             # 1 = равномерно, 2+ = долго яркие, потом быстро тают
  min-alpha: 0.10        # насколько прозрачным становится самый край (0.0 = исчезает совсем, 0.3 = остаётся виден)

# ── Вторая строка (под линейкой) ───────────────────────────────────────────
show-coords: true        # показывать X Y Z
lock-angle: 4            # если маркер ближе к центру, чем на N°, вместо координат показывается его имя и расстояние

# ── Какие маркеры показывать ───────────────────────────────────────────────
markers:
  spawn: true            # спавн мира
  home: true             # кровать / якорь возрождения
  death: true            # место последней смерти
max-distance: 0          # 0 = любое расстояние; иначе маркеры дальше N блоков скрываются
max-waypoints: 10        # сколько личных точек может поставить игрок (/waypoint add)

# Подсказка по значкам: wp (ромб) star home spawn death town war crown
